# Render Blueprint: one-click deploy of the API + UI (the database lives on Neon, see README "Deploy").
# Render dashboard -> New -> Blueprint -> pick this repository. You are asked for ConnectionStrings__Default once.
services:
  - type: web
    name: opsflow
    runtime: docker
    plan: free
    region: frankfurt            # pick the one closest to your Neon region (cannot be changed later)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT                # the Dockerfile listens on 8080
        value: "8080"
      - key: Jwt__Key            # random 256-bit value generated by Render; never leaves the dashboard
        generateValue: true
      - key: ConnectionStrings__Default
        sync: false              # paste the Neon connection URL when prompted
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Proxy__TrustForwardedHeaders   # Render's load balancer terminates TLS and sets X-Forwarded-*
        value: "true"
      - key: Proxy__ForwardLimit            # measured on Render: Cloudflare -> Render edge -> Render proxy -> app, so the client is 3rd from the right
        value: "3"
      - key: Security__BcryptWorkFactor   # the free instance has a fraction of a CPU; 10 is still the OWASP minimum
        value: "10"
      - key: Seed__Demo          # PUBLIC DEMO: publishes the demo password on the login page. Set to "false" for anything real.
        value: "true"
